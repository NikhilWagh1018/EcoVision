services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ecovision
      POSTGRES_PASSWORD: ecovision
      POSTGRES_DB: ecovision
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecovision"]
      interval: 5s
      retries: 10
  api:
    build: ./api
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./api:/code
      - ./storage:/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata:
